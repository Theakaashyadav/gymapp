<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FitBit | Auth</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/style.css">

  <style>
    :root {
      --dark: #060b0f;
      --card: rgba(13, 20, 26, 0.88);
      --card-2: rgba(255, 255, 255, 0.06);
      --green: #b7ff21;
      --green-2: #73e600;
      --white: #ffffff;
      --muted: #9aa4ad;
      --border: rgba(183, 255, 33, 0.22);
      --shadow: rgba(183, 255, 33, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    body.auth-page {
      margin: 0;
      min-height: 100vh;
      font-family: "Poppins", Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(183,255,33,.28), transparent 30%),
        radial-gradient(circle at bottom right, rgba(115,230,0,.18), transparent 32%),
        linear-gradient(135deg, #030607, #071018 45%, #0b1117);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      color: var(--white);
      overflow-x: hidden;
    }

    .auth-box {
      width: 100%;
      max-width: 430px;
      padding: 34px 28px;
      border-radius: 30px;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow:
        0 30px 80px rgba(0,0,0,.55),
        0 0 45px rgba(183,255,33,.12);
      backdrop-filter: blur(18px);
      position: relative;
      overflow: hidden;
    }

    .auth-box::before {
      content: "";
      position: absolute;
      width: 190px;
      height: 190px;
      background: rgba(183,255,33,.18);
      border-radius: 50%;
      top: -80px;
      right: -80px;
      filter: blur(35px);
    }

    .auth-box::after {
      content: "";
      position: absolute;
      width: 150px;
      height: 150px;
      background: rgba(115,230,0,.12);
      border-radius: 50%;
      bottom: -70px;
      left: -70px;
      filter: blur(35px);
    }

    .logo,
    form {
      position: relative;
      z-index: 2;
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .app-mark {
      width: 78px;
      height: 78px;
      margin: 0 auto 14px;
      border-radius: 24px;
      background: linear-gradient(145deg, #101820, #05080b);
      border: 1px solid rgba(183,255,33,.35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--green);
      font-size: 34px;
      font-weight: 900;
      box-shadow: 0 15px 35px rgba(183,255,33,.2);
    }

    .logo h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1;
      letter-spacing: -1px;
      color: var(--white);
    }

    .logo h1 span {
      color: var(--green);
    }

    .logo p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #d9e2e8;
      font-size: 13px;
      font-weight: 700;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      height: 52px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.1);
      background: var(--card-2);
      color: var(--white);
      padding: 0 16px;
      outline: none;
      font-size: 15px;
      transition: .25s ease;
    }

    .form-group select option {
      background: #0b1117;
      color: #fff;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 4px rgba(183,255,33,.12);
      background: rgba(255,255,255,.09);
    }

    .pin-boxes {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .pin-boxes input {
      height: 58px;
      padding: 0;
      text-align: center;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 0;
      border-radius: 18px;
      color: var(--green);
      caret-color: var(--green);
    }

    .pin-boxes input::placeholder {
      color: rgba(255,255,255,.22);
    }

    .pin-boxes input.filled {
      border-color: rgba(183,255,33,.55);
      background: rgba(183,255,33,.09);
      box-shadow: 0 0 0 4px rgba(183,255,33,.08);
    }

    button {
      height: 54px;
      border: 0;
      border-radius: 17px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 900;
      color: #071018;
      background: linear-gradient(135deg, var(--green), var(--green-2));
      box-shadow: 0 16px 35px var(--shadow);
      transition: .25s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 45px rgba(183,255,33,.34);
    }

    button:disabled {
      cursor: not-allowed;
      transform: none;
    }

    .login-status {
      display: none;
      text-align: center;
      margin-top: 8px;
      color: var(--green);
      font-size: 14px;
      font-weight: 800;
    }

    .toggle-text {
      text-align: center;
      margin-top: 18px;
      color: var(--muted);
      font-size: 14px;
    }

    .toggle-text span {
      color: var(--green);
      font-weight: 800;
      cursor: pointer;
    }

    .toggle-text span:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .auth-box {
        padding: 28px 20px;
        border-radius: 24px;
      }

      .logo h1 {
        font-size: 30px;
      }

      .pin-boxes {
        gap: 10px;
      }

      .pin-boxes input {
        height: 54px;
        font-size: 22px;
      }
    }
  </style>
</head>

<body class="auth-page">

<div class="auth-box">
  <div class="logo">
    <div class="app-mark">FB</div>
    <h1>Fit<span>Bit</span></h1>
    <p>Train • Track • Transform</p>
  </div>

  <form id="loginForm">
    <div class="form-group">
      <label>Email / Mobile</label>
      <input type="text" id="loginId" required>
    </div>

    <div class="form-group">
      <label>PIN</label>

      <div class="pin-boxes" data-target="loginPin">
        <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" placeholder="•">
        <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" placeholder="•">
        <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" placeholder="•">
        <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" placeholder="•">
      </div>

      <input type="hidden" id="loginPin" required>
    </div>

    <p class="login-status" id="loginStatus">Checking PIN...</p>

    <div class="toggle-text">
      New member? <span onclick="toggleAuth()">Create Account</span>
    </div>
  </form>

  <form id="registerForm" style="display:none;">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="regName" required>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" id="regEmail" required>
    </div>

    <div class="form-group">
      <label>Mobile</label>
      <input type="tel" inputmode="numeric" pattern="[0-9]*" id="regMobile" maxlength="10" required>
    </div>

    <div class="form-group">
      <label>Fitness Goal</label>
      <select id="regGoal">
        <option>Fat Loss</option>
        <option>Muscle Gain</option>
        <option>Strength</option>
        <option>Consistency</option>
        <option>General Fitness</option>
      </select>
    </div>

    <div class="form-group">
      <label>Create 4 Digit PIN</label>

      <div class="pin-boxes" data-target="regPin">
        <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" placeholder="•">
        <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" placeholder="•">
        <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" placeholder="•">
        <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" placeholder="•">
      </div>

      <input type="hidden" id="regPin" required>
    </div>

    <button type="submit" id="registerBtn" style="width:100%">Register</button>

    <div class="toggle-text">
      Already registered? <span onclick="toggleAuth()">Login</span>
    </div>
  </form>
</div>

<script src="js/app.js"></script>

<script>
console.log("✅ Auth page script loaded");

const LOGIN_ID_KEY = "fitbit_last_login_id";

const loginForm = document.getElementById("loginForm");
const registerForm = document.getElementById("registerForm");

const loginId = document.getElementById("loginId");
const loginPin = document.getElementById("loginPin");
const loginStatus = document.getElementById("loginStatus");

const regName = document.getElementById("regName");
const regEmail = document.getElementById("regEmail");
const regMobile = document.getElementById("regMobile");
const regGoal = document.getElementById("regGoal");
const regPin = document.getElementById("regPin");
const registerBtn = document.getElementById("registerBtn");

let isLoggingIn = false;

const savedLoginId = localStorage.getItem(LOGIN_ID_KEY);
if (savedLoginId) {
  loginId.value = savedLoginId;
}

function setupPinBoxes() {
  document.querySelectorAll(".pin-boxes").forEach((group) => {
    const targetId = group.dataset.target;
    const hiddenInput = document.getElementById(targetId);
    const boxes = Array.from(group.querySelectorAll("input"));

    function updatePinValue() {
      hiddenInput.value = boxes.map(box => box.value).join("");

      boxes.forEach(box => {
        box.classList.toggle("filled", box.value !== "");
      });

      if (targetId === "loginPin" && hiddenInput.value.length === 4) {
        autoLogin();
      }
    }

    boxes.forEach((box, index) => {
      box.addEventListener("input", function () {
        this.value = this.value.replace(/\D/g, "").slice(0, 1);

        if (this.value && index < boxes.length - 1) {
          boxes[index + 1].focus();
        }

        updatePinValue();
      });

      box.addEventListener("keydown", function (e) {
        if (e.key === "Backspace" && !this.value && index > 0) {
          boxes[index - 1].focus();
        }

        if (e.key === "ArrowLeft" && index > 0) {
          boxes[index - 1].focus();
        }

        if (e.key === "ArrowRight" && index < boxes.length - 1) {
          boxes[index + 1].focus();
        }
      });

      box.addEventListener("paste", function (e) {
        e.preventDefault();

        const pasted = (e.clipboardData || window.clipboardData)
          .getData("text")
          .replace(/\D/g, "")
          .slice(0, 4);

        pasted.split("").forEach((digit, i) => {
          if (boxes[i]) {
            boxes[i].value = digit;
          }
        });

        updatePinValue();

        const nextIndex = Math.min(pasted.length, boxes.length - 1);
        boxes[nextIndex].focus();
      });
    });
  });
}

function clearPinBoxes(targetId) {
  const group = document.querySelector(`.pin-boxes[data-target="${targetId}"]`);
  const hiddenInput = document.getElementById(targetId);

  if (!group || !hiddenInput) return;

  group.querySelectorAll("input").forEach(input => {
    input.value = "";
    input.classList.remove("filled");
    input.disabled = false;
  });

  hiddenInput.value = "";
}

function disablePinBoxes(targetId, disabled) {
  const group = document.querySelector(`.pin-boxes[data-target="${targetId}"]`);
  if (!group) return;

  group.querySelectorAll("input").forEach(input => {
    input.disabled = disabled;
  });
}

setupPinBoxes();

function toggleAuth() {
  const isLogin = loginForm.style.display !== "none";

  loginForm.style.display = isLogin ? "none" : "block";
  registerForm.style.display = isLogin ? "block" : "none";

  loginForm.reset();
  registerForm.reset();

  clearPinBoxes("loginPin");
  clearPinBoxes("regPin");

  isLoggingIn = false;
  loginStatus.style.display = "none";

  const savedLoginId = localStorage.getItem(LOGIN_ID_KEY);
  if (savedLoginId) {
    loginId.value = savedLoginId;
  }
}

function setButtonLoading(button, loading, text) {
  button.disabled = loading;
  button.textContent = loading ? "Processing..." : text;
  button.style.opacity = loading ? "0.7" : "1";
}

async function autoLogin() {
  if (isLoggingIn) return;

  const loginValue = loginId.value.trim().toLowerCase();
  const pinValue = loginPin.value.trim();

  if (!loginValue || !pinValue) {
    alert("Please enter email/mobile and PIN");
    clearPinBoxes("loginPin");
    return;
  }

  localStorage.setItem(LOGIN_ID_KEY, loginValue);

  if (!/^\d{4}$/.test(pinValue)) {
    alert("PIN must be exactly 4 digits");
    clearPinBoxes("loginPin");
    return;
  }

  isLoggingIn = true;
  loginStatus.textContent = "Checking PIN...";
  loginStatus.style.display = "block";
  disablePinBoxes("loginPin", true);

  try {
    const data = await apiRequest({
      action: "login",
      login_id: loginValue,
      pin: pinValue
    });

    if (data.status === "success" && data.user && data.user.member_id) {
      const saved = saveUser(data.user);

      if (saved) {
        loginStatus.textContent = "Login successful...";
        window.location.replace("dashboard.html");
      } else {
        alert("Login saved failed. Please try again.");
        resetAutoLogin();
      }
    } else {
      alert(data.message || "Invalid login details");
      resetAutoLogin();
    }

  } catch (err) {
    alert("Login failed. Please try again.");
    resetAutoLogin();
  }
}

function resetAutoLogin() {
  isLoggingIn = false;
  loginStatus.style.display = "none";
  clearPinBoxes("loginPin");
  disablePinBoxes("loginPin", false);

  const firstPinBox = document.querySelector('.pin-boxes[data-target="loginPin"] input');
  if (firstPinBox) firstPinBox.focus();
}

loginForm.addEventListener("submit", function (e) {
  e.preventDefault();
});

registerForm.addEventListener("submit", async function (e) {
  e.preventDefault();

  const nameValue = regName.value.trim();
  const emailValue = regEmail.value.trim().toLowerCase();
  const mobileValue = regMobile.value.trim();
  const pinValue = regPin.value.trim();

  if (!nameValue || !emailValue || !mobileValue || !pinValue) {
    alert("Please fill all required fields");
    return;
  }

  if (!/^\d{10}$/.test(mobileValue)) {
    alert("Please enter valid 10 digit mobile number");
    return;
  }

  if (!/^\d{4}$/.test(pinValue)) {
    alert("PIN must be exactly 4 digits");
    return;
  }

  setButtonLoading(registerBtn, true, "Register");

  try {
    const data = await apiRequest({
      action: "register",
      name: nameValue,
      email: emailValue,
      mobile: mobileValue,
      fitness_goal: regGoal.value,
      pin: pinValue
    });

    if (data.status === "success") {
      alert("Registration successful. Please login.");

      localStorage.setItem(LOGIN_ID_KEY, emailValue);

      registerForm.reset();
      clearPinBoxes("regPin");

      registerForm.style.display = "none";
      loginForm.style.display = "block";
      loginId.value = emailValue;
    } else {
      alert(data.message || "Registration failed");
    }

  } catch (err) {
    alert("Registration failed. Please try again.");
  }

  setButtonLoading(registerBtn, false, "Register");
});
</script>

</body>
</html>
