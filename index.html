<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitBit Splash</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #020403;
      overflow: hidden;
      color: #fff;
    }

    .splash-screen {
      min-height: 100vh;
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background:
        radial-gradient(circle at 45% 28%, rgba(183,255,33,.22), transparent 22%),
        radial-gradient(circle at 35% 52%, rgba(183,255,33,.14), transparent 24%),
        linear-gradient(135deg, #020403, #071008 45%, #000);
    }

    .splash-screen::before,
    .splash-screen::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .splash-screen::before {
      background:
        repeating-linear-gradient(
          115deg,
          transparent 0 18px,
          rgba(183,255,33,.08) 19px,
          transparent 22px
        );
      opacity: .45;
      transform: skewY(-10deg);
    }

    .splash-screen::after {
      background:
        radial-gradient(circle at top left, rgba(183,255,33,.2) 1px, transparent 2px),
        radial-gradient(circle at bottom right, rgba(183,255,33,.22) 1px, transparent 2px);
      background-size: 18px 18px;
      mask-image:
        radial-gradient(circle at top left, black, transparent 30%),
        radial-gradient(circle at bottom right, black, transparent 32%);
      opacity: .7;
    }

    .splash-content {
      width: 100%;
      max-width: 520px;
      min-height: 92vh;
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn .9s ease forwards;
    }

    .logo-wrap {
      width: min(92vw, 560px);
      margin-top: -60px;
      position: relative;
      filter: drop-shadow(0 0 22px rgba(183,255,33,.38));
      animation: floatLogo 3s ease-in-out infinite;
    }

    .logo-wrap img {
      width: 100%;
      display: block;
    }

    .glow-line {
      position: absolute;
      width: 65%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #b7ff21, transparent);
      left: -15%;
      bottom: 28%;
      box-shadow: 0 0 18px #b7ff21;
      transform: rotate(-28deg);
      animation: flash 2s ease-in-out infinite;
    }

    .loading-area {
      width: min(75vw, 420px);
      position: absolute;
      bottom: 9vh;
      text-align: center;
    }

    .loading-text {
      color: #b7ff21;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 10px;
      margin-bottom: 28px;
      text-shadow: 0 0 14px rgba(183,255,33,.9);
    }

    .progress-box {
      width: 100%;
      height: 18px;
      border-radius: 50px;
      border: 2px solid #b7ff21;
      padding: 3px;
      box-shadow:
        0 0 18px rgba(183,255,33,.55),
        inset 0 0 12px rgba(183,255,33,.18);
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: 50px;
      background: linear-gradient(90deg, #b7ff21, #73e600, #eaff8a);
      box-shadow: 0 0 22px rgba(183,255,33,.95);
      transition: width .18s linear;
      position: relative;
    }

    .progress-fill::after {
      content: "";
      position: absolute;
      right: -8px;
      top: 50%;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #eaff8a;
      transform: translateY(-50%);
      box-shadow: 0 0 22px #b7ff21;
    }

    .percent {
      color: #b7ff21;
      margin-top: 14px;
      font-weight: 800;
      letter-spacing: 2px;
      font-size: 13px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(.96); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes floatLogo {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes flash {
      0%, 100% { opacity: .25; transform: rotate(-28deg) translateX(-40px); }
      50% { opacity: 1; transform: rotate(-28deg) translateX(70px); }
    }

    @media (max-width: 480px) {
      .logo-wrap {
        width: 115vw;
        margin-top: -90px;
      }

      .loading-area {
        bottom: 8vh;
        width: 78vw;
      }

      .loading-text {
        font-size: 15px;
        letter-spacing: 7px;
      }

      .progress-box {
        height: 16px;
      }
    }
  </style>
</head>

<body>

<section class="splash-screen">
  <div class="splash-content">

    <div class="logo-wrap">
      <div class="glow-line"></div>

      <!-- Replace this image path with your splash/logo image -->
      <img src="images/flash.png" alt="FitBit Logo">
    </div>

    <div class="loading-area">
      <div class="loading-text">LOADING...</div>

      <div class="progress-box">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="percent" id="percentText">0%</div>
    </div>

  </div>
</section>

<script>
  const progressFill = document.getElementById("progressFill");
  const percentText = document.getElementById("percentText");

  let progress = 0;

  const loadingInterval = setInterval(() => {
    progress += Math.floor(Math.random() * 4) + 1;

    if (progress >= 100) {
      progress = 100;
      clearInterval(loadingInterval);

      setTimeout(() => {
        window.location.href = "auth.html";
      }, 500);
    }

    progressFill.style.width = progress + "%";
    percentText.textContent = progress + "%";
  }, 90);
</script>

</body>
</html>
