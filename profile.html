<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile | FitProof</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-layout">

  <button class="mobile-menu" onclick="document.querySelector('.sidebar').classList.toggle('show')">☰ Menu</button>

  <aside class="sidebar">
    <h2>FitProof</h2>
    <a href="dashboard.html">Dashboard</a>
    <a href="submit-task.html">Submit Daily Task</a>
    <a href="verify-task.html">Verify Tasks</a>
    <a href="leaderboard.html">Leaderboard</a>
    <a class="active" href="profile.html">Profile</a>
    <a href="rules.html">Rules</a>
    <a href="#" onclick="logout()">Logout</a>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1>My Profile</h1>
        <p>Manage your personal fitness details.</p>
      </div>
    </div>

    <div class="card">
      <form id="profileForm">
        <div class="grid grid-2">
          <div class="form-group">
            <label>Name</label>
            <input type="text" id="name">
          </div>

          <div class="form-group">
            <label>Email</label>
            <input type="email" id="email">
          </div>

          <div class="form-group">
            <label>Mobile</label>
            <input type="text" id="mobile">
          </div>

          <div class="form-group">
            <label>Fitness Goal</label>
            <select id="goal">
              <option>Fat Loss</option>
              <option>Muscle Gain</option>
              <option>Strength</option>
              <option>Consistency</option>
              <option>General Fitness</option>
            </select>
          </div>
        </div>

        <button type="submit">Update Profile</button>
      </form>
    </div>
  </main>
</div>

<script src="js/app.js"></script>
<script>
protectPage();

const user = getUser();

name.value = user.name || "";
email.value = user.email || "";
mobile.value = user.mobile || "";
goal.value = user.fitness_goal || "General Fitness";

profileForm.addEventListener("submit", async function(e) {
  e.preventDefault();

  const data = await apiRequest({
    action: "updateProfile",
    member_id: user.member_id,
    name: name.value,
    email: email.value,
    mobile: mobile.value,
    fitness_goal: goal.value
  });

  if (data.status === "success") {
    saveUser(data.user);
    alert("Profile updated successfully");
  } else {
    alert(data.message || "Profile update failed");
  }
});
</script>

</body>
</html>
