<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Submit Task | FitProof</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-layout">

  <button class="mobile-menu" onclick="document.querySelector('.sidebar').classList.toggle('show')">☰ Menu</button>

  <aside class="sidebar">
    <h2>FitProof</h2>
    <a href="dashboard.html">Dashboard</a>
    <a class="active" href="submit-task.html">Submit Daily Task</a>
    <a href="verify-task.html">Verify Tasks</a>
    <a href="leaderboard.html">Leaderboard</a>
    <a href="profile.html">Profile</a>
    <a href="rules.html">Rules</a>
    <a href="#" onclick="logout()">Logout</a>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1>Submit Daily Workout</h1>
        <p>Your task will become valid after 2 member verifications.</p>
      </div>
    </div>

    <div class="card">
      <form id="taskForm">
        <div class="grid grid-2">
          <div class="form-group">
            <label>Workout Date</label>
            <input type="date" id="taskDate" required>
          </div>

          <div class="form-group">
            <label>Workout Type</label>
            <select id="workoutType">
              <option>Gym Workout</option>
              <option>Cardio</option>
              <option>Running</option>
              <option>Cycling</option>
              <option>Yoga</option>
              <option>Home Workout</option>
              <option>Sports Activity</option>
              <option>Rest Day</option>
            </select>
          </div>

          <div class="form-group">
            <label>Exercise Category</label>
            <select id="category">
              <option>Chest</option>
              <option>Back</option>
              <option>Legs</option>
              <option>Shoulder</option>
              <option>Arms</option>
              <option>Core</option>
              <option>Full Body</option>
              <option>Cardio Only</option>
              <option>Stretching</option>
            </select>
          </div>

          <div class="form-group">
            <label>Duration Minutes</label>
            <input type="number" id="duration" min="0" required>
          </div>

          <div class="form-group">
            <label>Calories Burned</label>
            <input type="number" id="calories" min="0">
          </div>

          <div class="form-group">
            <label>Steps Count</label>
            <input type="number" id="steps" min="0">
          </div>
        </div>

        <div class="form-group">
          <label>Proof URL</label>
          <input type="url" id="proofUrl" placeholder="Google Drive image link / screenshot link">
        </div>

        <div class="form-group">
          <label>Workout Note</label>
          <textarea id="note" placeholder="Example: Completed chest workout and 20 min cardio"></textarea>
        </div>

        <button type="submit" id="submitTaskBtn">Submit Workout</button>
      </form>
    </div>
  </main>
</div>

<script src="js/app.js"></script>

<script>
if (protectPage()) {
  const submitTaskBtn = document.getElementById("submitTaskBtn");

  taskDate.valueAsDate = new Date();

  function setButtonLoading(button, loading, normalText) {
    button.disabled = loading;
    button.textContent = loading ? "Processing..." : normalText;
    button.style.opacity = loading ? "0.7" : "1";
    button.style.cursor = loading ? "not-allowed" : "pointer";
  }

  taskForm.addEventListener("submit", async function(e) {
    e.preventDefault();

    const user = getUser();

    if (!user) {
      window.location.replace("./index.html");
      return;
    }

    setButtonLoading(submitTaskBtn, true, "Submit Workout");

    try {
      const data = await apiRequest({
        action: "submitTask",
        member_id: user.member_id,
        member_name: user.name,
        task_date: taskDate.value,
        workout_type: workoutType.value,
        exercise_category: category.value,
        duration_minutes: duration.value,
        calories: calories.value,
        steps: steps.value,
        proof_url: proofUrl.value,
        note: note.value
      });

      if (data.status === "success") {
        submitTaskBtn.textContent = "Success ✅";

        alert(data.message || "Workout submitted successfully.");

        setTimeout(function () {
          window.location.reload();
        }, 500);

      } else {
        alert(data.message || "Submission failed");
        setButtonLoading(submitTaskBtn, false, "Submit Workout");
      }

    } catch (err) {
      console.error("SUBMIT TASK ERROR:", err);
      alert("Something went wrong. Please try again.");
      setButtonLoading(submitTaskBtn, false, "Submit Workout");
    }
  });
}
</script>

</body>
</html>
